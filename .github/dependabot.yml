version: 2
updates:
  # Terraform の provider（versions.tf と .terraform.lock.hcl）を更新する
  - package-ecosystem: terraform
    directories:
      - /1-organization
      - /2-foundation
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      terraform-providers:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # dev container の feature（.devcontainer/devcontainer.json）を更新する
  # Terraform 本体のバージョン（feature の "version" オプションと versions.tf の
  # required_version）は Dependabot の対象外なので、手動で合わせて更新する
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
